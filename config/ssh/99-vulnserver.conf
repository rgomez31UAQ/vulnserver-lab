# =============================================================================
# VulnServer - SSH drop-in configuration
# Installed as /etc/ssh/sshd_config.d/99-vulnserver.conf by install.sh.
#
# Design notes:
#  * Password authentication is ON because students must log in as labuser with
#    a known lab password. Inside an isolated lab that is acceptable; the
#    hardening phase replaces this with key-only auth.
#  * Root never logs in over SSH.
#  * Only the two lab accounts may authenticate.
#  * Access is restricted to SSH_ALLOWED_NETS by UFW as well (defence in depth);
#    this file cannot express source networks, see config/ufw/ufw-rules.sh.
# =============================================================================
Port 22
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AllowUsers adminlab labuser
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
# Banner makes the lab boundary obvious to anyone who connects.
Banner /etc/ssh/vulnserver-banner
