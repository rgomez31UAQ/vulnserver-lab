# =============================================================================
# VulnServer - config/lab.conf
# Central configuration for the laboratory.
#
# Every value uses ${VAR:=default} so that it can be overridden from the
# environment without editing this file, e.g.:
#   JUICE_SHOP_PORT=8080 sudo ./install.sh
#
# NOTE: the credentials below are DELIBERATELY public laboratory credentials.
# They are not secrets and must never be reused outside this isolated lab.
# =============================================================================

# --- Identity ---------------------------------------------------------------
: "${LAB_NAME:=VulnServer}"
: "${LAB_VERSION:=1.0}"
: "${LAB_STATE_DIR:=/opt/vulnserver}"

# --- Accounts (section 7 of the project brief) ------------------------------
# adminlab: owner of the server, full administration, never shared.
# labuser : unprivileged entry point used by the attacker/student.
# labpriv : intermediate privilege level required for the PRIVILEGE flag.
#           Created without a usable password; only reachable through the
#           intentionally broken sudo rule of Scenario B.
: "${ADMIN_USER:=adminlab}"
: "${LAB_USER:=labuser}"
: "${PRIV_USER:=labpriv}"
: "${LAB_USER_PASSWORD:=LabUser!2026}"
: "${ADMIN_USER_PASSWORD:=AdminLab!2026}"
: "${PRIV_USER_SHELL:=/bin/bash}"

# --- Network ---------------------------------------------------------------
# Juice Shop listens on this port. Bound to LAB_BIND_ADDR so it is never
# exposed on a public interface by accident.
: "${JUICE_SHOP_PORT:=3000}"
: "${JUICE_SHOP_IMAGE:=bkimminich/juice-shop:v17.1.1}"
: "${LAB_BIND_ADDR:=0.0.0.0}"
: "${LAB_NET_NAME:=vulnserver_labnet}"
: "${LAB_NET_SUBNET:=172.28.60.0/24}"

# SSH: only these source networks may connect. Adapt to your classroom/VPN.
: "${SSH_PORT:=22}"
: "${SSH_ALLOWED_NETS:=192.168.56.0/24 10.10.0.0/24}"
: "${LAB_ALLOWED_NETS:=192.168.56.0/24 10.10.0.0/24}"

# --- Docker / Juice Shop ---------------------------------------------------
# Compose project directory inside the state dir (compose file is copied there
# at install time so the running lab does not depend on the git checkout).
: "${LAB_WEB_DIR:=${LAB_STATE_DIR}/web}"
: "${JUICE_SHOP_MEMORY_LIMIT:=1g}"
: "${JUICE_SHOP_VOLUME:=vulnserver_juice_data}"

# --- Flags (section 8) -----------------------------------------------------
: "${FLAG_PREFIX:=VS}"
: "${FLAG_USER_FILE:=${LAB_STATE_DIR}/flags/user.txt}"
: "${FLAG_PRIV_FILE:=${LAB_STATE_DIR}/flags/privilege.txt}"
: "${FLAG_ROOT_FILE:=${LAB_STATE_DIR}/flags/root.txt}"

# --- Scenarios (section 6) -------------------------------------------------
# Scenario A - wrong file permissions (SUID on find + world-writable dir)
: "${SCENARIO_A_DIR:=${LAB_STATE_DIR}/lab/perms}"
: "${SCENARIO_A_SUID_BINARY:=/usr/bin/find}"

# Scenario B - insecure sudo (labuser -> labpriv via tar, then a root-owned
# script writable by labpriv)
: "${SCENARIO_B_HELPER:=/usr/local/bin/lab-healthcheck}"
: "${SCENARIO_B_SUDOERS:=/etc/sudoers.d/vulnserver-lab-b}"

# Scenario C - insecure cron (world-writable drop-in directory)
: "${SCENARIO_C_DIR:=${LAB_STATE_DIR}/lab/cron}"
: "${SCENARIO_C_SCRIPT:=${LAB_STATE_DIR}/lab/cron/lab-cleanup.sh}"
: "${SCENARIO_C_CRON:=/etc/cron.d/vulnserver-lab-c}"
: "${SCENARIO_C_SCHEDULE:=* * * * *}"

# --- Monitoring / hardening ------------------------------------------------
: "${AUDIT_RULES_FILE:=/etc/audit/rules.d/vulnserver.rules}"
: "${UFW_PROFILE:=vulnserver}"
: "${LOG_RETENTION_DAYS:=90}"

# --- Safety ----------------------------------------------------------------
# Hard stop: refuse to run the lab on anything that is not Ubuntu 24.04 unless
# explicitly overridden (e.g. inside the container test harness).
: "${REQUIRE_UBUNTU:=1}"
: "${ALLOW_PUBLIC_EXPOSURE:=0}"
