# =============================================================================
# VulnServer - config/scenarios/scenarios.conf
# Registry of the privilege-escalation scenarios. Read by lab-manager.sh,
# audit.sh, harden.sh and reset-lab.sh so that adding a scenario only requires
# one entry here plus one script under scripts/scenarios/.
#
# Format: one [id] block per scenario, KEY="value" lines, no spaces around "=".
# =============================================================================

[a]
NAME="Insecure file permissions (SUID + world-writable directory)"
SCRIPT="scenario-a.sh"
FLAG="privilege.txt (intermediate) / root.txt (root)"
RISK="high"
# Files/dirs the scenario touches; used for backup and for restore.
ARTIFACTS="/usr/bin/find:mode|/opt/vulnserver/lab/perms:mode"
DESCRIPTION="A SUID bit is set on a standard utility and a lab directory is world-writable. Demonstrates why any writable path executed by a privileged context is a root path."

[b]
NAME="Insecure sudo configuration (delegation to intermediate user)"
SCRIPT="scenario-b.sh"
FLAG="privilege.txt (intermediate) / root.txt (root)"
RISK="high"
ARTIFACTS="/etc/sudoers.d/vulnserver-lab-b:file|/usr/local/bin/lab-healthcheck:file"
DESCRIPTION="labuser may run tar as labpriv without a password; labpriv may run a root-owned helper script that labpriv itself can modify. Demonstrates over-broad delegation and writable privileged scripts."

[c]
NAME="Insecure cron job (world-writable drop-in directory)"
SCRIPT="scenario-c.sh"
FLAG="root.txt (root)"
RISK="high"
ARTIFACTS="/etc/cron.d/vulnserver-lab-c:file|/opt/vulnserver/lab/cron:mode"
DESCRIPTION="A root cron job executes a script from a directory any local user can write to. Demonstrates that scheduled tasks inherit the privileges of their executor."
